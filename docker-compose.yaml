version: '3.9'

services:
  app:
    build: .
    container_name: container-service
    image: container-service:latest
    depends_on:
      - mongo
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/demo
      SPRING_PROFILES_ACTIVE: docker
    # Optional health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  mongo:
    image: mongo:6.0
    container_name: booking-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: demo

volumes:
  mongo_data: